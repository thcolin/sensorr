services:
  sensorr-web:
    image: ghcr.io/thcolin/sensorr-web:${SENSORR_TAG:-latest}
    container_name: sensorr-web
    hostname: sensorr-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - 5070:80
      - 5071:443
    environment:
      - CADDY_TLS_MODE=${CADDY_TLS_MODE:-internal}
      - CADDY_DEBUG=${CADDY_DEBUG:-}
      - SENSORR_SSL_CERT_NAME=${SENSORR_SSL_CERT_NAME:-sensorr.cert}
      - SENSORR_SSL_KEY_NAME=${SENSORR_SSL_KEY_NAME:-sensorr.key}
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ${SENSORR_SSL_DIR:-./caddy/certs}:/certs:ro
    networks:
      - default
      - cards

  sensorr-api:
    image: ghcr.io/thcolin/sensorr-api:${SENSORR_TAG:-latest}
    container_name: sensorr-api
    hostname: sensorr-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      - NX_API_HOST=localhost
      - NX_API_PORT=4300
      - NX_API_DOCKER_ENV=true
      - NX_MONGO_HOST=sensorr-db
      - NX_MONGO_PORT=27017
      - NX_MONGO_USERNAME=${SENSORR_DATABASE_USERNAME:-sensorr}
      - NX_MONGO_PASSWORD=${SENSORR_DATABASE_PASSWORD:-sensorr}
      - NX_SENSORR_BIN=/app/bin/sensorr
      - NX_SENSORR_AUTH_SECRET=${SENSORR_AUTH_SECRET:-youshouldchangethisvaluetoanythingelse}
      - NX_SENSORR_USERNAME=${SENSORR_USERNAME:-sensorr}
      - NX_SENSORR_PASSWORD=${SENSORR_PASSWORD:-sensorr}
      - NX_SENSORR_VAPID_SUBJECT=${SENSORR_VAPID_SUBJECT:-mailto:mail@example.com}
      - NX_CHROMIUM_URL=http://sensorr-chromium:9222
      - NX_SENSORR_TAG=${SENSORR_TAG:-latest}
      - NX_UPDATER_URL=http://sensorr-updater:4310
    volumes:
      - ./config.json:/app/config.json
      - ./.secrets:/app/.secrets
      - ${SENSORR_BLACKHOLE:-./blackhole}:/blackhole
      - ${SENSORR_TVSHOWS:-./tvshows}:/tvshows
    networks:
      - default
      - cards
      - updater

  # Moves sensorr-api, sensorr-web and itself to another tag from Settings > Update. Opt-in, through
  # COMPOSE_PROFILES=updater in the env file. It holds the Docker socket, so it publishes no port and
  # only shares the updater network with sensorr-api
  sensorr-updater:
    image: ghcr.io/thcolin/sensorr-updater:${SENSORR_TAG:-latest}
    container_name: sensorr-updater
    hostname: sensorr-updater
    restart: unless-stopped
    profiles: [updater]
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: apps/updater/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.secrets:/secrets:ro
    networks:
      - updater

  # Draws the wrapped's story cards for the API. Debian's Chromium, for its software WebGL; no secret,
  # no volume, and a network that only reaches sensorr-web and sensorr-api
  sensorr-chromium:
    image: chromedp/headless-shell:151.0.7922.109
    container_name: sensorr-chromium
    hostname: sensorr-chromium
    restart: unless-stopped
    command: ['--enable-unsafe-swiftshader', '--disable-dev-shm-usage', '--hide-scrollbars', '--mute-audio']
    mem_limit: 1g
    networks:
      - cards

  sensorr-db:
    image: ghcr.io/thcolin/sensorr-db:${SENSORR_TAG:-latest}
    container_name: sensorr-db
    hostname: sensorr-db
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/db/Dockerfile
    environment:
      - MONGO_INITDB_DATABASE=sensorr
      - MONGO_INITDB_ROOT_USERNAME=${SENSORR_DATABASE_USERNAME:-sensorr}
      - MONGO_INITDB_ROOT_PASSWORD=${SENSORR_DATABASE_PASSWORD:-sensorr}
      - MONGO_REPLICA_SET_NAME=rs0
    volumes:
      - ./docker/sensorr-db:/docker-entrypoint-initdb.d:ro
      - ./.secrets:/opt/keyfile
      - ./db:/data/db
    healthcheck:
      test: |
        test $$(mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --eval "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'sensorr-db' }] }).ok } catch (_) { rs.status().ok }") -eq 1
      interval: 30s

networks:
  # No way out: Chromium only opens the wrapped page
  cards:
    internal: true
  # No way out either: the updater pulls through the Docker daemon, not through its network
  updater:
    internal: true
