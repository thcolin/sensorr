<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Programme 2026</title>
    <base href="/wrapped/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b8955a" />
    <meta name="robots" content="noindex" />
    <link rel="preload" href="/wrapped/assets/fonts/Knewave.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Declared here and not in styles.css, so the preload and the face point to the same file -->
    <style>
      @font-face {
        font-family: 'Knewave';
        src: url('/wrapped/assets/fonts/Knewave.woff2') format('woff2');
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Knewave';
        src: url('/wrapped/assets/fonts/Knewave-ext.woff2') format('woff2');
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: 'Patrick Hand';
        src: url('/wrapped/assets/fonts/PatrickHand.woff2') format('woff2');
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Patrick Hand';
        src: url('/wrapped/assets/fonts/PatrickHand-ext.woff2') format('woff2');
        font-display: swap;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
