name: Demo

on:
  push:
    branches: [main]
  # TMDB data may not be kept more than 6 months: the demo data is fetched again every month
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: >-
          npx ts-node -P tools/tsconfig.tools.json --transpile-only -O '{"target":"es2022","esModuleInterop":true}' tools/demo/seed.ts
        env:
          SENSORR_DEMO_TMDB_KEY: ${{ secrets.SENSORR_DEMO_TMDB_KEY }}
      - run: >-
          npx ts-node -r tsconfig-paths/register -P tools/tsconfig.tools.json --transpile-only -O '{"target":"es2022","esModuleInterop":true}' tools/site/films.ts
        env:
          SENSORR_DEMO_TMDB_KEY: ${{ secrets.SENSORR_DEMO_TMDB_KEY }}
      # The landing at the root of the pages, the demo in demo/ and its wrapped in demo/wrapped/
      - run: npx nx run site:build:production
      - run: npx nx run web:build:demo
        env:
          SENSORR_DEMO_TMDB_KEY: ${{ secrets.SENSORR_DEMO_TMDB_KEY }}
      # GitHub Pages answers an unknown path with the 404.html at its root: the demo routes it
      - run: cp dist/apps/pages/demo/index.html dist/apps/pages/404.html
      # Alex's wrapped, next to the app, at the one address the demo has: `wrapped/demo`, the folder its data is in
      - run: npx nx run wrapped:build:demo
      - run: cp dist/apps/pages/demo/wrapped/index.html dist/apps/pages/demo/wrapped/demo/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/apps/pages

  deploy:
    # A run dispatched from another branch builds, and publishes nothing
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
