name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # a release tag is checked against the history of dev and main
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: yarn
      - if: github.ref_type == 'tag'
        run: node tools/release/check-tag.mjs "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - run: yarn install --frozen-lockfile
      - run: npx nx run-many --target=lint --all
      - run: npx nx run-many --target=test --all
      - run: npx nx run-many --target=build --projects=api,cli,web,wrapped --configuration=production

  # amd64 and arm64 each build on a native runner, then one manifest per image
  image:
    if: github.event_name == 'push'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, db, updater]
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      file: apps/${{ matrix.app }}/Dockerfile
      platforms: linux/amd64,linux/arm64
      job-name-prefix: ${{ matrix.app }}
      meta-images: ghcr.io/thcolin/sensorr-${{ matrix.app }}
      meta-tags: |
        type=ref,event=branch
        type=sha,enable=${{ github.ref_type == 'branch' }}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=beta,enable=${{ github.ref_type == 'tag' && contains(github.ref_name, '-beta.') }}
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
